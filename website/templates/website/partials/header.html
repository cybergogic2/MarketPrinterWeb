<header class="border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
        <a href="/" class="text-xl font-bold text-gray-900">
            ПВЗшник<span class="text-brand-600">.рф</span>
        </a>

        <nav class="hidden md:flex items-center gap-8 text-sm text-gray-600">
            <a href="#how" class="hover:text-brand-600">Как работает</a>
            <a href="#features" class="hover:text-brand-600">Возможности</a>
            <a href="#pricing" class="hover:text-brand-600">Тарифы</a>
        </nav>

        <div class="flex items-center gap-3">
            {% if user.is_authenticated %}
                <a href="{% url 'account_dashboard' %}"
                   class="text-sm text-gray-600 hover:text-brand-600">
                    {{ user.username }}
                </a>
                <form method="post" action="{% url 'logout' %}" class="inline">
    {% csrf_token %}
    <button type="submit" class="text-sm text-gray-500 hover:text-gray-700">
        Выйти
    </button>
</form>
            {% else %}
                <a href="{% url 'login' %}"
                   class="text-sm text-gray-600 hover:text-brand-600">
                    Войти
                </a>
                <a href="{% url 'register' %}"
                   class="bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
                    Регистрация
                </a>
            {% endif %}
        </div>
    </div>
</header>
