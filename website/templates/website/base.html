{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ПВЗшник.рф — автоматизация печати ячеек ПВЗ{% endblock %}</title>
    <meta name="description" content="{% block description %}Автоматическая печать номеров ячеек для ПВЗ. Экономия времени, точность 98%, работает со всеми маркетплейсами.{% endblock %}">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            900: '#1e3a8a',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white text-gray-800 antialiased">

    {% include 'website/partials/header.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'website/partials/footer.html' %}

</body>
</html>
