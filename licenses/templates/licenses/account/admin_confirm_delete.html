{% extends 'licenses/account/base.html' %}

{% block title %}{{ title }} — {{ service_settings.service_name|default:"Magic ПВЗ" }}{% endblock %}

{% block account_content %}
<section class="account-card account-confirm">
    <h1>{{ title }}</h1>
    <p>
        <span class="account-token-key">{{ object_label }}</span><br>
        {{ warning }}
    </p>

    <form method="post" class="account-actions account-actions-center">
        {% csrf_token %}
        <button class="account-button account-button-danger" type="submit">
            <i data-lucide="trash-2" aria-hidden="true"></i>
            <span>Да, удалить</span>
        </button>
        <a class="account-button account-button-outline" href="{{ cancel_url }}">
            <i data-lucide="x" aria-hidden="true"></i>
            <span>Отмена</span>
        </a>
    </form>
</section>
{% endblock %}
